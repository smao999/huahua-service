services:
  # ---- 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: huahua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huahua
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: huahua-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ---- akshare gRPC 服务（Python） ----
  akshare:
    build:
      context: .
      dockerfile: akshare_server/Dockerfile
    container_name: huahua-akshare
    restart: unless-stopped
    ports:
      - "9800:9800"

  # ---- Go 主服务 ----
  app:
    build: .
    container_name: huahua-app
    restart: unless-stopped
    ports:
      - "8871:8871"
    environment:
      AKSHARE_GRPC_ADDR: akshare:9800
      # 容器内不能用 localhost，须用 compose 服务名
      DATABASE_DSN: host=postgres user=postgres password=postgres dbname=huahua port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
      - akshare

volumes:
  postgres_data:
  redis_data:
